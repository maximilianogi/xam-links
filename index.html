<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>xam</title>
<meta name="description" content="xam: TikTok, Instagram, YouTube, podcast, música, lecturas, películas, proyectos y contacto para marcas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D8D3CC; --surface:#EEEAE4; --surface-2:#E4DFD8; --ink:#1E1B19; --muted:#6B625B;
  --line:rgba(30,27,25,.14); --signal:#F2E15B; --signal-ink:#1E1B19;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2F2925; --surface:#3D3530; --surface-2:#463D37; --ink:#F3EEE8; --muted:#B5AAA0;
    --line:rgba(243,238,232,.14); --signal:#F2E15B; --signal-ink:#1E1B19;
  }
}
:root[data-theme="dark"]{
  --bg:#2F2925; --surface:#3D3530; --surface-2:#463D37; --ink:#F3EEE8; --muted:#B5AAA0;
  --line:rgba(243,238,232,.14); --signal:#F2E15B; --signal-ink:#1E1B19;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:17px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.page{max-width:460px;margin:0 auto;padding:0 0 48px}

/* Hero: la foto es el momento memorable */
.hero{position:relative;overflow:hidden}
.hero img{width:100%;aspect-ratio:700/765;object-fit:cover;transform:scale(1.25);transform-origin:50% 35%}
.hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom, transparent 38%, var(--bg) 90%);
}
.name{
  position:relative;z-index:1;margin:-0.62em 0 0;padding:0 20px;
  font-size:clamp(104px,34vw,156px);font-weight:800;letter-spacing:-.065em;line-height:.8;
  font-variation-settings:"opsz" 96;
}
.bio{margin:14px 20px 0;max-width:34ch;color:var(--muted);font-size:17px}

/* Redes: fila de chips con texto, sin logos */
.socials{display:flex;flex-wrap:wrap;gap:8px;margin:22px 20px 0;padding:0;list-style:none}
.socials a{
  display:inline-flex;align-items:baseline;gap:6px;padding:9px 14px;border-radius:999px;
  border:1px solid var(--line);font-weight:600;font-size:15px;
}
.socials small{font-weight:400;color:var(--muted);font-size:13px}

/* Marcas: la tarjeta con más peso */
.brands{
  margin:28px 12px 0;padding:20px;border-radius:22px;background:var(--signal);color:var(--signal-ink);
}
.brands h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brands p{margin:6px 0 16px;font-size:15px;opacity:.75}
.brands .row{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  font:inherit;font-size:15px;font-weight:600;border:0;cursor:pointer;
  padding:11px 16px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;
}
.btn-dark{background:var(--signal-ink);color:var(--signal)}
.btn-ghost{background:transparent;color:var(--signal-ink);box-shadow:inset 0 0 0 1.5px var(--signal-ink)}

/* Listas: dos mosaicos vivos lado a lado */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 12px 0}
.tile{
  position:relative;background:var(--surface);border-radius:18px;padding:16px;min-height:172px;
  display:flex;flex-direction:column;justify-content:space-between;gap:14px;
}
.tile .glyph{width:34px;height:34px}
.tile strong{display:block;font-size:19px;line-height:1.15;letter-spacing:-.01em}
.tile .now{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.3;margin-top:4px}
.tile .count{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.go{position:absolute;top:14px;right:16px;color:var(--muted);font-size:17px;line-height:1}
.stack{display:flex;height:58px;align-items:flex-end}
.stack img{width:39px;height:58px;object-fit:cover;border-radius:3px 5px 5px 3px;box-shadow:0 4px 10px -4px rgba(0,0,0,.45);background:var(--surface-2)}
.stack img + img{margin-left:-14px}

/* Lo más reciente */
.section-title{margin:30px 20px 10px;font-size:15px;font-weight:600;color:var(--muted)}
.recent{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 12px}
.recent a{display:block;background:var(--surface);border-radius:18px;overflow:hidden;position:relative}
.recent img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface-2)}
.recent .txt{padding:10px 12px 13px}
.recent .src{font-size:12px;font-weight:600;color:var(--muted)}
.recent .ttl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:600;line-height:1.25;margin-top:3px}
.recent .when{display:block;font-size:12px;color:var(--muted);margin-top:5px}

/* Filas */
.rows{margin:10px 12px 0;background:var(--surface);border-radius:18px;overflow:hidden}
.rows > *{display:flex;align-items:center;gap:14px;padding:16px}
.rows > * + *{border-top:1px solid var(--line)}
.rows .glyph{width:26px;height:26px;flex:none}
.rows .txt{flex:1;min-width:0}
.rows strong{font-weight:600}
.rows span{display:block;color:var(--muted);font-size:14px}
.rows .arrow{color:var(--muted);flex:none}
.rows .soon{color:var(--muted)}
.rows .soon strong{color:var(--ink)}
.rows .soon .arrow{font-size:13px}
.projects-title{margin-top:30px}
.projects{margin-top:0}

.glyph{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.foot{margin:36px 20px 0;color:var(--muted);font-size:13px}

a:focus-visible,button:focus-visible{outline:2.5px solid var(--ink);outline-offset:3px}
.brands a:focus-visible,.brands button:focus-visible{outline-color:var(--signal-ink)}
@media (hover:hover){
  .tile:hover,.rows a:hover,.recent a:hover{background:var(--surface-2)}
  .socials a:hover{background:var(--surface)}
}
.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<main class="page">
  <header>
    <div class="hero"><img src="IMG_5601.png" alt="xam mirando a la cámara desde arriba, con piso de grava de fondo"></div>
    <h1 class="name">xam</h1>
    <p class="bio">Hago videos y podcast sobre entretenimiento, libros y cultura digital.</p>
  </header>

  <ul class="socials" id="socials" aria-label="Redes sociales"></ul>

  <section class="brands" aria-labelledby="brands-title">
    <h2 id="brands-title">¿Eres marca?</h2>
    <p>Campañas y colaboraciones.</p>
    <div class="row">
      <a class="btn btn-dark" id="mailto" href="#">Escribir correo</a>
      <button class="btn btn-ghost" id="copy" type="button">Copiar correo</button>
    </div>
  </section>

  <div class="tiles" id="tiles"></div>

  <section id="recent-wrap" aria-labelledby="recent-title" hidden>
    <h2 class="section-title" id="recent-title">Lo más reciente</h2>
    <div class="recent" id="recent"></div>
  </section>

  <nav class="rows" id="rows" aria-label="Más links"></nav>

  <section aria-labelledby="projects-title">
    <h2 class="section-title projects-title" id="projects-title">Otros proyectos</h2>
    <div class="rows projects" id="projects"></div>
  </section>

  <p class="foot">© xam</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================================================================
   EDITA AQUÍ TUS LINKS
   - url: pon el link real (los "#" son marcadores)
   - desde / hasta (opcional, formato "2026-10-01"): el link solo
     aparece entre esas fechas. Útil para campañas.
   ================================================================ */
const CONFIG = {
  email: "xam@brolanagency.com",
  socials: [
    { label: "TikTok",    extra: "1.2M", url: "https://www.tiktok.com/@xam" },
    { label: "Instagram", extra: "215K", url: "https://www.instagram.com/wvxam/" },
    { label: "YouTube", extra: "47K", url: "https://www.youtube.com/@xaaaaaaaaaam" },
    { label: "Mi Podcast", extra: "1K", url: "https://www.youtube.com/@ElDesgraciadopodcast" },
    { label: "Twitch", extra: "25K", url: "https://www.twitch.tv/xaaaaaaaaaam" }
  ],
  // Los mosaicos se actualizan solos con lo que sincroniza Notion.
  tiles: [
    { label: "Lecturas",  icon: "book", url: "/libros",    datos: "libros" },
    { label: "Películas", icon: "film", url: "/peliculas", datos: "peliculas" },
  ],
  rows: [
    { label: "Mi música en Spotify", sub: "Canciones", icon: "music", url: "https://open.spotify.com/artist/79wdjPfxv8eUyx9dFAdaqE" },
    // Ejemplo de link programado:
    // { label: "Reel con Marca X", sub: "Código XAM10", icon: "star", url: "#", desde: "2026-10-01", hasta: "2026-10-15" },
  ],
  // Proyectos: sin url (o con pronto: true) aparecen como "Próximamente".
  proyectos: [
    { label: "serendip.cool", sub: "Escribe aquí de qué trata", icon: "spark", url: "https://serendip.cool" },
    { label: "El mito de Sísifo", sub: "Un juego sobre empujar la roca", icon: "rock", url: "https://elmitodesisifo.com" },
    { label: "Cuaderno", sub: "Para practicar la escritura en otros idiomas", icon: "pen", pronto: true },
  ],
};

const ICONS = {
  book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5A2.5 2.5 0 0 1 4 20.5"/>',
  film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
  music:'<circle cx="7" cy="17" r="3"/><circle cx="17" cy="15" r="3"/><path d="M10 17V5l10-2v12"/>',
  live:'<circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/>',
  rock:'<path d="M3 20h18"/><path d="M7 20l3-9 4-1 3 3 1 7"/><circle cx="12" cy="7" r="2.2"/>',
  pen:'<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/>',
};
const svg = n => `<svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||ICONS.star}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function vigente(l){
  const hoy = new Date().toISOString().slice(0,10);
  if (l.desde && hoy < l.desde) return false;
  if (l.hasta && hoy > l.hasta) return false;
  return true;
}
const attrs = u => `href="${esc(u)}"${/^https?:/.test(u) ? ' target="_blank" rel="noopener"' : ''}`;

document.getElementById('socials').innerHTML = CONFIG.socials.filter(vigente).map(s =>
  `<li><a ${attrs(s.url)}>${esc(s.label)}${s.extra ? ` <small>${esc(s.extra)}</small>` : ''}</a></li>`).join('');

const flecha = u => /^https?:/.test(u) ? "↗" : "→";

function fila(r){
  const cuerpo = `${svg(r.icon)}<div class="txt"><strong>${esc(r.label)}</strong>${r.sub ? `<span>${esc(r.sub)}</span>` : ''}</div>`;
  if (r.pronto || !r.url) return `<div class="soon">${cuerpo}<span class="arrow">Próximamente</span></div>`;
  return `<a ${attrs(r.url)}>${cuerpo}<span class="arrow" aria-hidden="true">${flecha(r.url)}</span></a>`;
}
document.getElementById('rows').innerHTML = CONFIG.rows.filter(vigente).map(fila).join('');
document.getElementById('projects').innerHTML = CONFIG.proyectos.filter(vigente).map(fila).join('');

/* Mosaicos: primero se pintan sencillos y luego se llenan con los datos de Notion */
function mosaico(t, extra = {}){
  const visual = extra.portadas?.length
    ? `<div class="stack">${extra.portadas.slice(0,3).map(src => `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`).join('')}</div>`
    : svg(t.icon);
  return `<a class="tile" ${attrs(t.url)} data-k="${t.datos||''}">${visual}<span class="go" aria-hidden="true">→</span>
    <div><strong>${esc(t.label)}</strong>${extra.ahora ? `<span class="now">${esc(extra.ahora)}</span>` : ''}${extra.total ? `<span class="count">${esc(extra.total)}</span>` : ''}</div></a>`;
}
const tilesEl = document.getElementById('tiles');
const TILES = CONFIG.tiles.filter(vigente);
tilesEl.innerHTML = TILES.map(t => mosaico(t)).join('');

const cargar = u => fetch(u, { cache: "no-cache" }).then(r => r.ok ? r.json() : Promise.reject(r.status));
const resumen = {
  async libros(){
    const { items } = await cargar('/libros/libros.json');
    const leyendo = items.filter(b => b.e === 'leyendo').sort((a,b) => (b.d0||'').localeCompare(a.d0||''));
    const leidos = items.filter(b => b.e === 'leido').length;
    const ahora = leyendo.length ? `Leyendo: ${leyendo[0].t}` : '';
    const total = leyendo.length > 1 ? `${leyendo.length} en curso, ${leidos} leídos` : `${leidos} leídos`;
    return { ahora, total, portadas: leyendo.map(b => b.c).filter(Boolean) };
  },
  async peliculas(){
    const { items } = await cargar('/peliculas/peliculas.json');
    const vistas = items.filter(p => p.e === 'vista');
    const recientes = vistas.filter(p => p.d1).sort((a,b) => b.d1.localeCompare(a.d1));
    return {
      ahora: recientes.length ? `Última: ${recientes[0].t}` : '',
      total: `${vistas.length} vistas`,
      portadas: recientes.filter(p => p.p).slice(0,3).map(p => `https://image.tmdb.org/t/p/w154${p.p}`),
    };
  },
};
TILES.forEach(async (t, i) => {
  if (!resumen[t.datos]) return;
  try { const extra = await resumen[t.datos](); tilesEl.children[i].outerHTML = mosaico(t, extra); } catch {}
});

/* Lo más reciente: último video y último episodio (se actualiza con la sincronización) */
function haceCuanto(f){
  const d = Math.floor((Date.now() - new Date(f + 'T12:00:00')) / 864e5);
  if (d <= 0) return 'Hoy';
  if (d === 1) return 'Ayer';
  if (d < 7) return `Hace ${d} días`;
  if (d < 30) return `Hace ${Math.floor(d/7)} ${Math.floor(d/7) === 1 ? 'semana' : 'semanas'}`;
  const [y,m,dd] = f.split('-').map(Number);
  return `${dd} de ${['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][m-1]}`;
}
cargar('/recientes.json').then(({ items }) => {
  if (!items?.length) return;
  document.getElementById('recent').innerHTML = items.map(v =>
    `<a ${attrs(v.url)}><img src="https://i.ytimg.com/vi/${esc(v.id)}/mqdefault.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="txt"><span class="src">${esc(v.canal)}</span><span class="ttl">${esc(v.titulo)}</span><span class="when">${haceCuanto(v.fecha)}</span></div></a>`).join('');
  document.getElementById('recent-wrap').hidden = false;
}).catch(() => {});

document.getElementById('mailto').href = 'mailto:' + CONFIG.email + '?subject=' + encodeURIComponent('Colaboración con xam');

const toast = document.getElementById('toast');
function aviso(t){ toast.textContent = t; toast.classList.add('show'); clearTimeout(aviso.t); aviso.t = setTimeout(()=>toast.classList.remove('show'), 1800); }
document.getElementById('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(CONFIG.email); aviso('Correo copiado'); }
  catch { aviso(CONFIG.email); }
});
</script>
</body>
</html>
