name: Sincronizar con Notion

on:
  schedule:
    - cron: "0 12 * * *"   # todos los días a las 6:00 am (hora de CDMX)
  workflow_dispatch:        # botón "Run workflow" para actualizar al momento
    inputs:
      forzar:
        description: "Volver a buscar las portadas y pósters que no se encontraron"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # siempre la versión más reciente, también al usar "Re-run"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Leer Notion y generar datos
        run: node scripts/sync.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          FORZAR: ${{ inputs.forzar && '1' || '' }}

      - name: Guardar cambios en el repo
        run: |
          git config user.name "wvxam-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libros peliculas
          if git diff --cached --quiet; then
            echo "No hubo cambios."
          else
            git commit -m "Sincronización con Notion"
            git pull --rebase origin main
            git push
          fi
